<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agente PMT | Preparação para o Mundo do Trabalho</title>
<meta name="description" content="Assistente educacional do PMT para carreira, estudos e administração digital.">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#11181b;font:16px/1.5 Arial,sans-serif}.app{max-width:820px;height:100vh;height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 30px #0001}
header{padding:16px 18px;background:#035aa6;color:#fff;display:flex;align-items:center;gap:12px}header h1{font-size:20px;margin:0}header small{opacity:.9}.brand{width:44px;height:44px;border-radius:14px;background:#ffce00;color:#11181b;display:grid;place-items:center;font-size:23px;font-weight:bold}
#chat{flex:1;overflow:auto;padding:20px 16px;background:#f7f9fb}.msg{max-width:88%;padding:12px 15px;border-radius:17px;margin:9px 0;white-space:pre-wrap}.bot{background:#fff;border:1px solid #dce5eb;border-bottom-left-radius:5px}.user{margin-left:auto;background:#035aa6;color:#fff;border-bottom-right-radius:5px}.choices{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0 18px}.choice{border:2px solid #035aa6;background:#fff;color:#035aa6;border-radius:12px;padding:10px 13px;font-weight:bold;cursor:pointer}.choice:hover{background:#eaf4fc}.system{font-size:13px;color:#59656b;text-align:center;margin:12px}
footer{padding:12px;border-top:1px solid #ddd;background:#fff}.links{text-align:center;font-size:12px;margin-top:8px}.links a{color:#035aa6}.hidden{display:none}
</style></head>
<body><div class="app">
<header><div class="brand">PM</div><div><h1>Agente PMT</h1><small>Preparação para o Mundo do Trabalho</small></div></header>
<main id="chat"></main>
<footer><div id="actions"></div><div class="links">Demonstração educacional • sem coleta de dados • <a href="https://github.com/sayjinblackbelt/2026_Professional_Projects_Meu_Primeiro_Curriculo">GitHub</a></div></footer>
</div>
<script>
const chat=document.getElementById('chat'),actions=document.getElementById('actions');let area=null,step=0,answers=[];
const flows={
carreira:{name:'💼 Carreira',intro:'Vamos preparar você para o mundo do trabalho. Vou fazer algumas perguntas e, com suas respostas, organizar o próximo passo.',qs:[
['Qual é seu objetivo agora?',['Criar meu primeiro currículo','Analisar uma vaga','Treinar entrevista','Preparar processo seletivo']],
['Você já tem alguma experiência, projeto, curso ou atividade que gostaria de apresentar?',['Sim','Ainda não','Não sei o que conta como experiência']],
['Qual é seu próximo passo mais importante?',['Montar currículo','Entender uma vaga','Praticar entrevista','Criar um plano de preparação']]]},
estudos:{name:'📚 Estudos',intro:'Vamos transformar sua necessidade em um plano de aprendizagem. Primeiro entendemos o objetivo; depois praticamos.',qs:[
['O que você quer aprender ou melhorar?',['Informática','Matemática','Comunicação','Outro assunto']],
['Como você se sente com esse conteúdo hoje?',['Estou começando','Sei o básico','Já pratico, mas tenho dificuldades','Quero aprofundar']],
['O que você precisa alcançar?',['Aprender o básico','Fazer uma atividade','Preparar uma avaliação','Aplicar na prática']]]},
admin:{name:'🖥️ Administração Digital',intro:'Vou ajudar você a realizar uma tarefa e aprender a lógica por trás dela. Você poderá usar Office, Google Workspace ou LibreOffice.',qs:[
['O que você precisa fazer?',['Documento','Planilha','Apresentação','E-mail/agenda','Organizar arquivos']],
['Qual ferramenta você vai usar?',['Microsoft Office','Google Workspace','LibreOffice','Não sei ainda']],
['Você já sabe realizar essa tarefa?',['Sim, mas quero melhorar','Sei um pouco','Estou começando','Nunca fiz']]]}
};
function add(text,who='bot'){let d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function buttons(items,fn){actions.innerHTML='';let box=document.createElement('div');box.className='choices';items.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>{actions.innerHTML='';fn(x)};box.appendChild(b)});actions.appendChild(box)}
function home(){area=null;step=0;answers=[];add('Olá! 👋\nEu sou o Agente PMT, um assistente demonstrativo para ajudar você a desenvolver autonomia para o mundo do trabalho.\n\nEscolha uma área para começar:');buttons(['💼 Carreira','📚 Estudos','🖥️ Administração Digital'],x=>start(x))}
function start(x){area=x.startsWith('💼')?'carreira':x.startsWith('📚')?'estudos':'admin';step=0;answers=[];add(flows[area].name,'user');add(flows[area].intro);ask()}
function ask(){let q=flows[area].qs[step];add(q[0]);buttons(q[1],answer)}
function answer(x){answers.push(x);add(x,'user');step++;if(step<flows[area].qs.length){setTimeout(ask,250)}else finish()}
function finish(){const f=flows[area];let next=area==='carreira'?'Agora eu organizaria suas informações e iniciaria '+answers[0].toLowerCase()+'.':area==='estudos'?'Agora eu montaria um pequeno plano: objetivo → conteúdo → prática → verificação.':'Agora eu orientaria a tarefa passo a passo e, quando possível, mostraria como fazer o mesmo em outra ferramenta.';add('Ótimo. ✅\n\n'+next+'\n\nEsta é uma demonstração do fluxo pedagógico. A versão completa poderá conectar este roteiro aos prompts e agentes do projeto.');buttons(['🔄 Começar outra área','🏠 Voltar ao início'],x=>{chat.innerHTML='';home()})}
home();
</script></body></html>
