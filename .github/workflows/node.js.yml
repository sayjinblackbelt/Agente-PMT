name: Project Validation CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate multilingual documentation
        run: |
          set -euo pipefail
          for file in README.md README.en.md README.es.md; do
            test -s "$file"
            grep -q "Filipe G Morais" "$file"
            grep -q "github.com/sayjinblackbelt" "$file"
          done

      - name: Validate documentation links
        run: |
          set -euo pipefail
          for file in README.md README.en.md README.es.md; do
            grep -oE 'docs/[A-Za-z0-9_./-]+\.md' "$file" | while read -r target; do
              test -f "$target" || { echo "Missing: $target"; exit 1; }
            done
          done

      - name: Validate repository structure
        run: |
          test -s index.md
          test -d docs
          test -d projects
          find docs projects -type f -name '*.md' | grep -q .

      - name: Privacy guard
        run: |
          if grep -RInE '(AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{20,}|sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' . --exclude-dir=.git; then
            echo "Potential secret detected."
            exit 1
          fi
